# Refresh the anonymous energy snapshot and deploy the site to GitHub Pages.
# Requires: Settings > Pages > Build and deployment > Source = "GitHub Actions".
# The build job reads secrets only from the production environment.
# A name that environment does not have is unset. There is no repository-secret fallback.
# TESLA_CLIENT_ID, TESLA_REFRESH_TOKEN, TESLA_SITE_ID, TESLA_SITE_TZ,
# GH_SECRETS_PAT, TESLA_API_BASE (optional).
name: Refresh energy snapshot

on:
  schedule:
    # Shifted from 7,37 to 11,41 so GitHub re-registers the schedule; 7,37 had never fired.
    - cron: "11,41 * * * *"   # best effort: GitHub may delay or drop scheduled runs at busy times
  workflow_dispatch:
  push:
    branches: [main]          # change if your default branch is named differently
    paths-ignore:
      - "README.md"
      - "scripts/make_example_data.py"

# Only one run at a time, and never cancel a run mid-way: the refresh token is
# single-use, so a cancelled run could lose the rotated token.
concurrency:
  group: energy-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # production should allow main only. Secrets are stored only in this environment.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before any secrets are used: fail the build if the tree matches secret patterns.
      - name: Scan repository for secrets
        run: python3 scripts/scan_repo.py

      - name: Refresh Tesla access token
        env:
          TESLA_CLIENT_ID: ${{ secrets.TESLA_CLIENT_ID }}
          TESLA_REFRESH_TOKEN: ${{ secrets.TESLA_REFRESH_TOKEN }}
        run: python3 scripts/refresh.py token --out-dir "$RUNNER_TEMP/tesla"

      # Must run right after the refresh: the old refresh token is now used up.
      # Writes only the production environment (gh secret set --env production),
      # retrying with backoff. If that still fails, the run fails: re-authorize
      # with scripts/get_refresh_token.py. Never writes a repository secret.
      - name: Save rotated refresh token
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: python3 scripts/actions_env_secrets.py save-refresh-token --file "$RUNNER_TEMP/tesla/refresh_token"

      - name: Get previous snapshot (for today's battery trail)
        run: curl -fsS --max-time 15 "https://${GITHUB_REPOSITORY_OWNER}.github.io/data.json" -o "$RUNNER_TEMP/prev.json" || echo "no previous snapshot"

      - name: Assemble site (public files only)
        run: |
          mkdir -p _site
          cp -r index.html app.js styles.css data.json vendor callback .well-known .nojekyll _site/
          test -s _site/.well-known/appspecific/com.tesla.3p.public-key.pem

      - name: Fetch and sanitize snapshot
        env:
          TESLA_SITE_ID: ${{ secrets.TESLA_SITE_ID }}
          TESLA_SITE_TZ: ${{ secrets.TESLA_SITE_TZ }}
          TESLA_API_BASE: ${{ secrets.TESLA_API_BASE }}
        run: python3 scripts/refresh.py fetch --token-dir "$RUNNER_TEMP/tesla" --previous "$RUNNER_TEMP/prev.json" --out _site/data.json

      - name: Verify public data (allowlist)
        run: python3 scripts/verify_public_data.py _site/data.json

      - name: Remove token files
        if: always()
        run: rm -rf "$RUNNER_TEMP/tesla"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true   # needed so .well-known/ is published
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
