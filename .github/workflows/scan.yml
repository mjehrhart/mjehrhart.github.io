# Read-only secret scan for pull requests and branch pushes.
# Does not use secrets and does not deploy.
name: Scan repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan repository for secrets
        run: python3 scripts/scan_repo.py
